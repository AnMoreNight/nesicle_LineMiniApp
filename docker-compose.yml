services:
  postgres:
    image: postgres:16-alpine
    container_name: nesicle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nesicle
      POSTGRES_PASSWORD: nesicle_dev_password
      POSTGRES_DB: nesicle
    ports:
      - "5432:5432"
    volumes:
      - nesicle_pg_data:/var/lib/postgresql/data

volumes:
  nesicle_pg_data:
